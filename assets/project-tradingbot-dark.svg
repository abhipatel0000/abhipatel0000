      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
  </defs>
  <rect width="580" height="195" rx="16" fill="url(#pGradDark_tradingbot)" stroke="#30363d" stroke-width="1.2"/>
  <rect x="1" y="1" width="578" height="193" rx="15" fill="none" stroke="#f72585" stroke-width="1.2" stroke-opacity="0.3"/>
  

<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 130" fill="none">
  <defs>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090514" />
      <stop offset="40%" stop-color="#18122B" />
      <stop offset="80%" stop-color="#0f1123" />
      <stop offset="100%" stop-color="#08071a" />
    </linearGradient>

    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#9d4edd" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f72585" stop-opacity="0.7"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#c77dff"/>
      <stop offset="100%" stop-color="#f72585"/>
    </linearGradient>

    <filter id="waveGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes waveMove1 {
      0% { transform: translateX(0); }
      50% { transform: translateX(-40px); }
      100% { transform: translateX(0); }
    }
    @keyframes waveMove2 {
      0% { transform: translateX(0); }
      50% { transform: translateX(40px); }
      100% { transform: translateX(0); }
    }
    @keyframes starPulse {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }
    .wave1 { animation: waveMove1 8s ease-in-out infinite; }
    .wave2 { animation: waveMove2 10s ease-in-out infinite; }
    .star { animation: starPulse 3s ease-in-out infinite; }
  </style>

  <!-- Container -->
  <rect width="1200" height="130" rx="18" fill="url(#footerBg)"/>

  <!-- Glowing Animated Wave Paths -->
  <path class="wave1" d="M -50 40 Q 250 10 550 40 T 1150 35 T 1300 45" fill="none" stroke="url(#waveGrad1)" stroke-width="2.5" opacity="0.8" filter="url(#waveGlow)"/>
  <path class="wave2" d="M -50 48 Q 300 65 650 35 T 1250 40" fill="none" stroke="#00F2FE" stroke-width="1.5" opacity="0.4"/>

  <!-- Particle Dots -->
  <circle cx="200" cy="30" r="2" fill="#00F2FE" class="star" style="animation-delay: 0.2s;"/>
  <circle cx="450" cy="65" r="2.5" fill="#f72585" class="star" style="animation-delay: 1.1s;"/>
  <circle cx="750" cy="25" r="2" fill="#9d4edd" class="star" style="animation-delay: 1.8s;"/>
  <circle cx="980" cy="55" r="2.5" fill="#00ff88" class="star" style="animation-delay: 0.7s;"/>

  <!-- Footer Text -->
  <text x="600" y="86" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="url(#textGrad)" letter-spacing="1">
    ⚡ CRAFTED WITH PASSION &amp; CODE BY ABHI PATEL • THANKS FOR VISITING! ⚡
  </text>
  <text x="600" y="108" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#94a3b8" letter-spacing="0.5">
    ⭐ Don't forget to star repositories you find interesting!
  </text>
</svg>

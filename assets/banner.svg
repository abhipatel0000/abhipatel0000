<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 340" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08071a" />
      <stop offset="40%" stop-color="#0f1123" />
      <stop offset="80%" stop-color="#18122B" />
      <stop offset="100%" stop-color="#090514" />
    </linearGradient>

    <linearGradient id="accentCyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="45%" stop-color="#4FACFE" />
      <stop offset="80%" stop-color="#9d4edd" />
      <stop offset="100%" stop-color="#f72585" />
    </linearGradient>

    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0" />
      <stop offset="20%" stop-color="#00F2FE" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#9d4edd" stop-opacity="1" />
      <stop offset="80%" stop-color="#f72585" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#f72585" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="badgeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <linearGradient id="badgeBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#9d4edd" stop-opacity="0.5" />
    </linearGradient>

    <!-- Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowSoft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#6366f1" stroke-width="0.75" stroke-opacity="0.07"/>
      <circle cx="40" cy="0" r="1" fill="#00F2FE" fill-opacity="0.2"/>
    </pattern>
  </defs>

  <style>
    @keyframes floatOrb {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(25px, -18px) scale(1.08); }
    }
    @keyframes floatOrbRev {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(-20px, 15px) scale(1.12); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; filter: drop-shadow(0 0 15px #00F2FE); }
      50% { opacity: 0.75; filter: drop-shadow(0 0 25px #9d4edd); }
    }
    @keyframes scanline {
      0% { transform: translateY(0); }
      100% { transform: translateY(340px); }
    }
    @keyframes typeCycle {
      0%, 20% { opacity: 1; transform: translateY(0); }
      23%, 97% { opacity: 0; transform: translateY(8px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes typeCycle2 {
      0%, 23% { opacity: 0; transform: translateY(8px); }
      26%, 46% { opacity: 1; transform: translateY(0); }
      49%, 100% { opacity: 0; transform: translateY(8px); }
    }
    @keyframes typeCycle3 {
      0%, 49% { opacity: 0; transform: translateY(8px); }
      52%, 72% { opacity: 1; transform: translateY(0); }
      75%, 100% { opacity: 0; transform: translateY(8px); }
    }
    @keyframes typeCycle4 {
      0%, 75% { opacity: 0; transform: translateY(8px); }
      78%, 97% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(8px); }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes badgeFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    .bg-orb1 { animation: floatOrb 9s ease-in-out infinite; }
    .bg-orb2 { animation: floatOrbRev 12s ease-in-out infinite; }
    .neon-pulse { animation: pulseGlow 4s ease-in-out infinite; }
    .badge-anim { animation: badgeFloat 6s ease-in-out infinite; }
    .badge-anim-delay { animation: badgeFloat 6s ease-in-out infinite 3s; }
    
    .cursor-blink { animation: blink 0.9s infinite; }
    
    .cycle-text-1 { animation: typeCycle 14s ease-in-out infinite; }
    .cycle-text-2 { animation: typeCycle2 14s ease-in-out infinite; }
    .cycle-text-3 { animation: typeCycle3 14s ease-in-out infinite; }
    .cycle-text-4 { animation: typeCycle4 14s ease-in-out infinite; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="340" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Cyber Grid Pattern -->
  <rect width="1200" height="340" rx="24" fill="url(#cyberGrid)"/>

  <!-- Glowing Mesh Orbs -->
  <g class="bg-orb1">
    <circle cx="150" cy="80" r="140" fill="#00F2FE" opacity="0.09" filter="url(#neonGlow)" />
    <circle cx="1080" cy="260" r="160" fill="#9d4edd" opacity="0.12" filter="url(#neonGlow)" />
  </g>
  <g class="bg-orb2">
    <circle cx="600" cy="30" r="120" fill="#6366f1" opacity="0.1" filter="url(#neonGlow)" />
    <circle cx="1020" cy="70" r="90" fill="#f72585" opacity="0.08" filter="url(#neonGlow)" />
    <circle cx="120" cy="280" r="110" fill="#4FACFE" opacity="0.09" filter="url(#neonGlow)" />
  </g>

  <!-- Card Border Glow -->
  <rect x="1" y="1" width="1198" height="338" rx="23" fill="none" stroke="url(#accentCyanPurple)" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Corner Tech Brackets -->
  <path d="M 28 50 L 28 28 L 50 28" fill="none" stroke="#00F2FE" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <path d="M 1172 50 L 1172 28 L 1150 28" fill="none" stroke="#f72585" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <path d="M 28 290 L 28 312 L 50 312" fill="none" stroke="#00F2FE" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <path d="M 1172 290 L 1172 312 L 1150 312" fill="none" stroke="#9d4edd" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>

  <!-- Top Status Pill / Live Badge -->
  <g transform="translate(600, 48)" text-anchor="middle">
    <rect x="-130" y="-15" width="260" height="30" rx="15" fill="url(#badgeBg)" stroke="url(#badgeBorder)" stroke-width="1"/>
    <circle cx="-105" cy="0" r="4" fill="#00ff88">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="-92" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#00ff88" letter-spacing="1">AVAILABLE FOR COLLABS</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="128" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
    Hi, I'm <tspan fill="url(#accentCyanPurple)" filter="url(#glowSoft)">Abhi Patel</tspan> 🚀
  </text>

  <!-- Subtitle Tagline -->
  <text x="600" y="172" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" fill="#b4c6ef" letter-spacing="0.5">
    Full-Stack Software Engineer &amp; AI Builder
  </text>

  <!-- Glowing Accent Divider -->
  <line x1="380" y1="196" x2="820" y2="196" stroke="url(#glowLine)" stroke-width="2" stroke-linecap="round"/>

  <!-- Dynamic Animated Typing Text Carousel -->
  <g transform="translate(600, 238)" text-anchor="middle">
    <!-- Line 1 -->
    <g class="cycle-text-1">
      <text font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="18.5" font-weight="600" fill="#00F2FE">
        <tspan fill="#9d4edd">&gt;</tspan> Building scalable full-stack web applications &amp; smart AI tools
      </text>
    </g>

    <!-- Line 2 -->
    <g class="cycle-text-2">
      <text font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="18.5" font-weight="600" fill="#4FACFE">
        <tspan fill="#f72585">&gt;</tspan> Technical Lead @ ISAC | Computer Science &amp; Engg '27
      </text>
    </g>

    <!-- Line 3 -->
    <g class="cycle-text-3">
      <text font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="18.5" font-weight="600" fill="#9d4edd">
        <tspan fill="#00F2FE">&gt;</tspan> Crafting high-performance APIs, sleek UX &amp; clean architecture
      </text>
    </g>

    <!-- Line 4 -->
    <g class="cycle-text-4">
      <text font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="18.5" font-weight="600" fill="#00ff88">
        <tspan fill="#f72585">&gt;</tspan> Obsessed with turning complex problems into elegant software
      </text>
    </g>
  </g>

  <!-- Tech Capsules / Quick Pills along Bottom -->
  <g transform="translate(600, 292)" text-anchor="middle">
    <!-- Pill 1 -->
    <g transform="translate(-320, 0)" class="badge-anim">
      <rect x="-85" y="-13" width="170" height="26" rx="13" fill="#13152c" stroke="#4FACFE" stroke-width="1" stroke-opacity="0.4"/>
      <text y="4.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">📍 Ahmedabad, India</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(-105, 0)" class="badge-anim-delay">
      <rect x="-85" y="-13" width="170" height="26" rx="13" fill="#13152c" stroke="#9d4edd" stroke-width="1" stroke-opacity="0.4"/>
      <text y="4.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">🎓 Indus University '27</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(105, 0)" class="badge-anim">
      <rect x="-85" y="-13" width="170" height="26" rx="13" fill="#13152c" stroke="#f72585" stroke-width="1" stroke-opacity="0.4"/>
      <text y="4.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">⚡ Full-Stack &amp; AI/ML</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(320, 0)" class="badge-anim-delay">
      <rect x="-85" y="-13" width="170" height="26" rx="13" fill="#13152c" stroke="#00ff88" stroke-width="1" stroke-opacity="0.4"/>
      <text y="4.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">🎬 Video &amp; UI Creator</text>
    </g>
  </g>
</svg>

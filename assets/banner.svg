<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="Hi, I'm Abhi - Full-Stack and Mobile Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="50%" stop-color="#302b63"/>
      <stop offset="100%" stop-color="#6c63ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6c63ff"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>
  </defs>
  <style>
    .title { font: 700 54px 'Segoe UI', Arial, sans-serif; fill: #ffffff; animation: fadeUp 1.2s ease-out both; }
    .sub   { font: 500 22px 'Segoe UI', Arial, sans-serif; fill: #cfd0ff; animation: fadeUp 1.2s ease-out 0.3s both; }
    .line  { font: 600 22px 'Courier New', monospace; fill: #00d4ff; opacity: 0; animation: cycle 12s infinite; }
    .l2 { animation-delay: 3s; } .l3 { animation-delay: 6s; } .l4 { animation-delay: 9s; }
    .orb1 { animation: float 7s ease-in-out infinite; }
    .orb2 { animation: float 9s ease-in-out infinite reverse; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes cycle {
      0%   { opacity: 0; transform: translateY(8px); }
      4%   { opacity: 1; transform: translateY(0); }
      21%  { opacity: 1; transform: translateY(0); }
      25%  { opacity: 0; transform: translateY(-8px); }
      100% { opacity: 0; }
    }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
  </style>

  <rect width="1000" height="260" rx="18" fill="url(#bg)"/>
  <circle class="orb1" cx="880" cy="60" r="90" fill="#ffffff" opacity="0.06"/>
  <circle class="orb2" cx="120" cy="220" r="70" fill="#00d4ff" opacity="0.08"/>
  <circle class="orb1" cx="700" cy="230" r="40" fill="#ffffff" opacity="0.05"/>

  <text class="title" x="500" y="100" text-anchor="middle">Hi, I'm Abhi</text>
  <text class="sub" x="500" y="142" text-anchor="middle">Full-Stack &amp; Mobile Developer  |  CSE Student</text>
  <rect x="440" y="160" width="120" height="4" rx="2" fill="url(#accent)"/>

  <text class="line l1" x="500" y="212" text-anchor="middle">&gt; Building full-stack &amp; mobile apps</text>
  <text class="line l2" x="500" y="212" text-anchor="middle">&gt; Turning ideas into real products</text>
  <text class="line l3" x="500" y="212" text-anchor="middle">&gt; Technical Lead @ ISAC</text>
  <text class="line l4" x="500" y="212" text-anchor="middle">&gt; Always learning, always shipping</text>
</svg>

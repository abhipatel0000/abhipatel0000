<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 350" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08071a" />
      <stop offset="40%" stop-color="#0f1123" />
      <stop offset="80%" stop-color="#18122B" />
      <stop offset="100%" stop-color="#090514" />
    </linearGradient>

    <linearGradient id="accentCyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="45%" stop-color="#4FACFE" />
      <stop offset="80%" stop-color="#9d4edd" />
      <stop offset="100%" stop-color="#f72585" />
    </linearGradient>

    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0" />
      <stop offset="25%" stop-color="#00F2FE" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#9d4edd" stop-opacity="1" />
      <stop offset="75%" stop-color="#f72585" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#f72585" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="statusBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0.04" />
    </linearGradient>

    <linearGradient id="statusBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="chipBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>

    <!-- Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowSoft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#6366f1" stroke-width="0.75" stroke-opacity="0.08"/>
      <circle cx="40" cy="0" r="1" fill="#00F2FE" fill-opacity="0.25"/>
    </pattern>
  </defs>

  <style>
    @keyframes floatOrb {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(25px, -18px); }
    }
    @keyframes floatOrbRev {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(-20px, 15px); }
    }
    @keyframes dotFade {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    @keyframes typeCycle1 {
      0%, 20% { opacity: 1; transform: translateY(0); }
      24%, 96% { opacity: 0; transform: translateY(8px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes typeCycle2 {
      0%, 24% { opacity: 0; transform: translateY(8px); }
      28%, 48% { opacity: 1; transform: translateY(0); }
      52%, 100% { opacity: 0; transform: translateY(8px); }
    }
    @keyframes typeCycle3 {
      0%, 52% { opacity: 0; transform: translateY(8px); }
      56%, 76% { opacity: 1; transform: translateY(0); }
      80%, 100% { opacity: 0; transform: translateY(8px); }
    }
    @keyframes typeCycle4 {
      0%, 80% { opacity: 0; transform: translateY(8px); }
      84%, 96% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(8px); }
    }

    .bg-orb1 { animation: floatOrb 9s ease-in-out infinite; }
    .bg-orb2 { animation: floatOrbRev 12s ease-in-out infinite; }
    .status-dot-pulse { animation: dotFade 1.8s ease-in-out infinite; }
    
    .cycle-text-1 { animation: typeCycle1 14s ease-in-out infinite; }
    .cycle-text-2 { animation: typeCycle2 14s ease-in-out infinite; }
    .cycle-text-3 { animation: typeCycle3 14s ease-in-out infinite; }
    .cycle-text-4 { animation: typeCycle4 14s ease-in-out infinite; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="350" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Cyber Grid Pattern -->
  <rect width="1200" height="350" rx="24" fill="url(#cyberGrid)"/>

  <!-- Glowing Mesh Orbs -->
  <g class="bg-orb1">
    <circle cx="150" cy="80" r="140" fill="#00F2FE" opacity="0.10" filter="url(#neonGlow)" />
    <circle cx="1080" cy="270" r="160" fill="#9d4edd" opacity="0.13" filter="url(#neonGlow)" />
  </g>
  <g class="bg-orb2">
    <circle cx="600" cy="30" r="130" fill="#6366f1" opacity="0.11" filter="url(#neonGlow)" />
    <circle cx="1020" cy="70" r="90" fill="#f72585" opacity="0.09" filter="url(#neonGlow)" />
    <circle cx="120" cy="290" r="110" fill="#4FACFE" opacity="0.09" filter="url(#neonGlow)" />
  </g>

  <!-- Card Border Glow -->
  <rect x="1" y="1" width="1198" height="348" rx="23" fill="none" stroke="url(#accentCyanPurple)" stroke-width="1.5" stroke-opacity="0.45"/>

  <!-- Corner Tech Brackets -->
  <path d="M 28 50 L 28 28 L 50 28" fill="none" stroke="#00F2FE" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <path d="M 1172 50 L 1172 28 L 1150 28" fill="none" stroke="#f72585" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <path d="M 28 300 L 28 322 L 50 322" fill="none" stroke="#00F2FE" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <path d="M 1172 300 L 1172 322 L 1150 322" fill="none" stroke="#9d4edd" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>

  <!-- Top Status Pill / Live Badge -->
  <rect x="470" y="30" width="260" height="34" rx="17" fill="url(#statusBg)" stroke="url(#statusBorder)" stroke-width="1.2"/>
  <circle cx="500" cy="47" r="4.5" fill="#00ff88" class="status-dot-pulse"/>
  <text x="515" y="52" text-anchor="start" font-family="'Segoe UI', -apple-system, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#00ff88" letter-spacing="1.2">AVAILABLE FOR COLLABS</text>

  <!-- Main Title -->
  <text x="600" y="128" text-anchor="middle" font-family="'Segoe UI', -apple-system, Arial, sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
    Hi, I'm <tspan fill="url(#accentCyanPurple)" filter="url(#glowSoft)">Abhi Patel</tspan> 🚀
  </text>

  <!-- Subtitle Tagline -->
  <text x="600" y="172" text-anchor="middle" font-family="'Segoe UI', -apple-system, Arial, sans-serif" font-size="20" font-weight="600" fill="#b4c6ef" letter-spacing="0.5">
    Full-Stack Software Engineer &amp; AI Builder
  </text>

  <!-- Glowing Accent Divider -->
  <line x1="380" y1="196" x2="820" y2="196" stroke="url(#glowLine)" stroke-width="2" stroke-linecap="round"/>

  <!-- Dynamic Animated Typing Text Carousel -->
  <g transform="translate(600, 238)" text-anchor="middle">
    <!-- Line 1 -->
    <g class="cycle-text-1">
      <text font-family="'Courier New', Courier, monospace" font-size="19" font-weight="700" fill="#00F2FE">
        <tspan fill="#9d4edd">&gt;</tspan> Building scalable full-stack web applications &amp; smart AI tools
      </text>
    </g>

    <!-- Line 2 -->
    <g class="cycle-text-2">
      <text font-family="'Courier New', Courier, monospace" font-size="19" font-weight="700" fill="#4FACFE">
        <tspan fill="#f72585">&gt;</tspan> Technical Lead @ ISAC | Computer Science &amp; Engg '27
      </text>
    </g>

    <!-- Line 3 -->
    <g class="cycle-text-3">
      <text font-family="'Courier New', Courier, monospace" font-size="19" font-weight="700" fill="#9d4edd">
        <tspan fill="#00F2FE">&gt;</tspan> Crafting high-performance APIs, sleek UX &amp; clean architecture
      </text>
    </g>

    <!-- Line 4 -->
    <g class="cycle-text-4">
      <text font-family="'Courier New', Courier, monospace" font-size="19" font-weight="700" fill="#00ff88">
        <tspan fill="#f72585">&gt;</tspan> Obsessed with turning complex problems into elegant software
      </text>
    </g>
  </g>

  <!-- Bottom Information Badges (High-Resolution Vector Icons & Perfectly Centered) -->
  <!-- Chip 1: Location -->
  <g>
    <rect x="185" y="278" width="230" height="36" rx="18" fill="url(#chipBg)" stroke="#4FACFE" stroke-width="1.2" stroke-opacity="0.5"/>
    <!-- Vector Location Pin -->
    <g transform="translate(210, 287) scale(0.75)">
      <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z" fill="#00F2FE"/>
    </g>
    <text x="315" y="301" text-anchor="middle" font-family="'Segoe UI', -apple-system, Arial, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">Ahmedabad, India</text>
  </g>

  <!-- Chip 2: University & Batch -->
  <g>
    <rect x="465" y="278" width="270" height="36" rx="18" fill="url(#chipBg)" stroke="#9d4edd" stroke-width="1.2" stroke-opacity="0.5"/>
    <!-- Vector Graduation Cap -->
    <g transform="translate(488, 287) scale(0.75)">
      <path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3z M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z" fill="#c77dff"/>
    </g>
    <text x="612" y="301" text-anchor="middle" font-family="'Segoe UI', -apple-system, Arial, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">Indus University CSE '27</text>
  </g>

  <!-- Chip 3: Role & Leadership -->
  <g>
    <rect x="785" y="278" width="230" height="36" rx="18" fill="url(#chipBg)" stroke="#00ff88" stroke-width="1.2" stroke-opacity="0.5"/>
    <!-- Vector Zap / Lightning -->
    <g transform="translate(808, 287) scale(0.75)">
      <path d="M7 2v11h3v9l7-12h-4l4-8z" fill="#00ff88"/>
    </g>
    <text x="912" y="301" text-anchor="middle" font-family="'Segoe UI', -apple-system, Arial, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">Tech Lead @ ISAC</text>
  </g>
</svg>

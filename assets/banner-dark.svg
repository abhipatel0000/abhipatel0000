<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 340" fill="none">
  <defs>
    
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="45%" stop-color="#0d1117" />
      <stop offset="85%" stop-color="#14132b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    
    
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="35%" stop-color="#6366f1" />
      <stop offset="70%" stop-color="#9d4edd" />
      <stop offset="100%" stop-color="#f72585" />
    </linearGradient>
    
    
    <linearGradient id="dividerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0" />
      <stop offset="20%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="1" />
      <stop offset="80%" stop-color="#f72585" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#f72585" stop-opacity="0" />
    </linearGradient>
    
    
    <linearGradient id="statusBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0.08" />
    </linearGradient>
    
    <filter id="meshGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="32" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <pattern id="techGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#6366f1" stroke-width="0.75" stroke-opacity="0.07" />
      <circle cx="36" cy="0" r="0.8" fill="#00f2fe" fill-opacity="0.2" />
    </pattern>
  </defs>

  <style>
    @keyframes pulseOrb1 {
      0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.18; }
      50% { transform: translate(30px, -20px) scale(1.1); opacity: 0.28; }
    }
    @keyframes pulseOrb2 {
      0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.16; }
      50% { transform: translate(-30px, 20px) scale(1.08); opacity: 0.24; }
    }
    @keyframes livePulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }
    @keyframes cycle1 {
      0%, 20% { opacity: 1; transform: translateY(0); }
      24%, 96% { opacity: 0; transform: translateY(6px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes cycle2 {
      0%, 24% { opacity: 0; transform: translateY(6px); }
      28%, 48% { opacity: 1; transform: translateY(0); }
      52%, 100% { opacity: 0; transform: translateY(6px); }
    }
    @keyframes cycle3 {
      0%, 52% { opacity: 0; transform: translateY(6px); }
      56%, 76% { opacity: 1; transform: translateY(0); }
      80%, 100% { opacity: 0; transform: translateY(6px); }
    }
    @keyframes cycle4 {
      0%, 80% { opacity: 0; transform: translateY(6px); }
      84%, 96% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(6px); }
    }

    .orb-1 { animation: pulseOrb1 10s ease-in-out infinite; }
    .orb-2 { animation: pulseOrb2 12s ease-in-out infinite; }
    .status-dot { animation: livePulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }

    .carousel-line-1 { animation: cycle1 16s ease-in-out infinite; }
    .carousel-line-2 { animation: cycle2 16s ease-in-out infinite; }
    .carousel-line-3 { animation: cycle3 16s ease-in-out infinite; }
    .carousel-line-4 { animation: cycle4 16s ease-in-out infinite; }
  </style>

  <!-- Card Background -->
  <rect width="1200" height="340" rx="20" fill="url(#bgGrad)" />
  <rect width="1200" height="340" rx="20" fill="url(#techGrid)" />

  <!-- Glowing Mesh Orbs -->
  <g class="orb-1">
    <circle cx="180" cy="90" r="130" fill="#00f2fe" filter="url(#meshGlow)" />
    <circle cx="1060" cy="240" r="150" fill="#9d4edd" filter="url(#meshGlow)" />
  </g>
  <g class="orb-2">
    <circle cx="600" cy="50" r="120" fill="#6366f1" filter="url(#meshGlow)" />
    <circle cx="980" cy="80" r="100" fill="#f72585" filter="url(#meshGlow)" />
  </g>

  <!-- Outer Border -->
  <rect x="1" y="1" width="1198" height="338" rx="19" fill="none" stroke="url(#accentGrad)" stroke-width="1.2" stroke-opacity="0.4" />

  <!-- Corner Brackets -->
  <path d="M 24 44 L 24 24 L 44 24" fill="none" stroke="#00f2fe" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  <path d="M 1176 44 L 1176 24 L 1156 24" fill="none" stroke="#f72585" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  <path d="M 24 296 L 24 316 L 44 316" fill="none" stroke="#00f2fe" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  <path d="M 1176 296 L 1176 316 L 1156 316" fill="none" stroke="#9d4edd" stroke-width="2" stroke-linecap="round" opacity="0.8" />

  <!-- Top Live Status Pill: OPEN TO PROJECTS & COLLABS -->
  <g>
    <rect x="420" y="28" width="360" height="32" rx="16" fill="url(#statusBg)" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="442" cy="44" r="4" fill="#00ff88" class="status-dot" />
    <text x="456" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#00ff88" letter-spacing="0.8">OPEN TO PROJECTS &amp; COLLABS</text>
  </g>

  <!-- Hero Main Heading -->
  <text x="600" y="125" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="48" font-weight="800" fill="#ffffff" letter-spacing="-0.8">
    Hi, I'm <tspan fill="url(#accentGrad)" filter="url(#softGlow)">Abhi Patel</tspan>
  </text>

  <!-- Subtitle -->
  <text x="600" y="165" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="500" fill="#94a3b8" letter-spacing="0.2">
    Full-Stack Engineer &amp; AI Solutions Architect
  </text>

  <!-- Glowing Line -->
  <line x1="380" y1="190" x2="820" y2="190" stroke="url(#dividerGrad)" stroke-width="1.8" stroke-linecap="round" />

  <!-- Animated Typing / Role Carousel -->
  <g transform="translate(600, 230)" text-anchor="middle">
    <!-- Item 1 -->
    <g class="carousel-line-1">
      <text font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="17" font-weight="600" fill="#00f2fe">
        <tspan fill="#6366f1">&gt;</tspan> Next.js · React · Node.js · FastAPI · Spring Boot
      </text>
    </g>

    <!-- Item 2 -->
    <g class="carousel-line-2">
      <text font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="17" font-weight="600" fill="#c77dff">
        <tspan fill="#f72585">&gt;</tspan> Building AI/ML Systems, LLM Agents &amp; Intelligent Workflows
      </text>
    </g>

    <!-- Item 3 -->
    <g class="carousel-line-3">
      <text font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="17" font-weight="600" fill="#00ff88">
        <tspan fill="#00f2fe">&gt;</tspan> Architecting High-Performance APIs, Microservices &amp; Databases
      </text>
    </g>

    <!-- Item 4 -->
    <g class="carousel-line-4">
      <text font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="17" font-weight="600" fill="#f72585">
        <tspan fill="#6366f1">&gt;</tspan> Crafting Premium UI/UX &amp; Cinematic Visual Experiences
      </text>
    </g>
  </g>

  <!-- Bottom Badges: Location, University, Tech Lead @ ISAC -->
  <g transform="translate(255, 274)">
    <!-- Badge 1: Location -->
    <rect x="0" y="0" width="190" height="34" rx="17" fill="#ffffff" fill-opacity="0.04" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.3" />
    <path d="M 22 17 C 22 13 25 10 29 10 C 33 10 36 13 36 17 C 36 21 29 26 29 26 C 29 26 22 21 22 17 Z M 27 17 A 2 2 0 1 0 31 17 A 2 2 0 1 0 27 17 Z" fill="#00f2fe" />
    <text x="108" y="21" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#c9d1d9">Ahmedabad, India</text>

    <!-- Badge 2: University -->
    <rect x="210" y="0" width="240" height="34" rx="17" fill="#ffffff" fill-opacity="0.04" stroke="#6366f1" stroke-width="1" stroke-opacity="0.3" />
    <path d="M 230 14 L 241 8 L 252 14 L 241 20 Z M 234 18.5 V 23.5 C 234 23.5 237 26 241 26 C 245 26 248 23.5 248 23.5 V 18.5" fill="none" stroke="#6366f1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
    <text x="340" y="21" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#c9d1d9">Indus University '27</text>

    <!-- Badge 3: Tech Lead @ ISAC -->
    <rect x="470" y="0" width="220" height="34" rx="17" fill="#ffffff" fill-opacity="0.04" stroke="#9d4edd" stroke-width="1" stroke-opacity="0.4" />
    <path d="M 492 11 L 486 18 L 493 18 L 488 25 L 497 16 L 491 16 Z" fill="#9d4edd" />
    <text x="590" y="21" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#c9d1d9">Tech Lead @ ISAC</text>
  </g>
</svg>